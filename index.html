<!doctype html>
<html lang="en" class="dark" style="background-color: #0b1120; color-scheme: dark; background: #0b1120;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowDown Download Manager</title>
    <style>
      :root {
        color-scheme: dark;
        background-color: #0b1120;
      }
      html, body {
        background-color: #0b1120 !important;
        background: #0b1120 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        background-color: #0b1120 !important;
        min-height: 100vh;
        width: 100%;
        height: 100%;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0b1120;
        color: #38bdf8;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-radius: 50%;
        border-top-color: #38bdf8;
        animation: spin 0.8s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0b1120] text-slate-100 antialiased min-h-screen">
    <div id="root">
      <div class="app-preloader">
        <div class="spinner"></div>
        <div style="margin-top: 16px; font-weight: 600; font-size: 14px; letter-spacing: 0.05em; color: #94a3b8;">
          Starting FlowDown Download Manager...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
