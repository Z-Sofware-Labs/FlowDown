[package]
name = "flowdown"
version = "2.0.6"
description = "FlowDown Desktop App with Rust Backend Engine"
authors = ["Z Software Labs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
rand = "0.8"
ring = "0.17"
sysinfo = "0.30"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
librqbit = "9.1.0"
librqbit-core = "9.1.0"
librqbit-dht = "9.1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

